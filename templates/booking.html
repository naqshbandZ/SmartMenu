{% extends "layout.html"%}
{% block title %}Book a Table{% endblock %}
{% block content%}
<section class="page-hero">
    <div>
        <span class="eyebrow">Reservations</span>
        <h1>Book a Table</h1>
        <p>Choose your date, time, and party size for a calm seaside dining experience.</p>
    </div>
</section>

<section class="form-shell glass-panel">
    <form method="POST" action="/add_booking" class="glass-form">
        <div class="form-grid">
            <div class="field-group">
                <label class="form-label">Customer Name</label>
                <input type="text" name="customer_name" class="form-control" placeholder="Your name" required>
            </div>

            <div class="field-group">
                <label class="form-label">Phone</label>
                <input type="text" name="customer_phone" class="form-control" placeholder="Contact number" required>
            </div>

            <div class="field-group">
                <label class="form-label">Date</label>
                <input type="text" id="date" name="date" class="form-control" placeholder="Select date" required>
            </div>

            <div class="field-group">
                <label class="form-label">Time</label>
                <select name="time" class="form-select" required>
                    <option value="10:00">10:00 AM</option>
                    <option value="11:00">11:00 AM</option>
                    <option value="12:00">12:00 PM</option>
                    <option value="13:00">1:00 PM</option>
                    <option value="14:00">2:00 PM</option>
                    <option value="15:00">3:00 PM</option>
                    <option value="16:00">4:00 PM</option>
                    <option value="17:00">5:00 PM</option>
                    <option value="18:00">6:00 PM</option>
                    <option value="19:00">7:00 PM</option>
                    <option value="20:00">8:00 PM</option>
                    <option value="21:00">9:00 PM</option>
                    <option value="22:00">10:00 PM</option>
                </select>
            </div>

            <div class="field-group">
                <label class="form-label">Guests</label>
                <input type="number" name="guests" class="form-control" min="1" placeholder="2" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="bi bi-calendar-plus"></i>
            Book Table
        </button>
    </form>
</section>

{% endblock %}

{% block extra_js %}
<script>
flatpickr("#date", {
    dateFormat: "Y-m-d",

    disable: [
        function(date) {
            let month = date.getMonth();
            let day = date.getDay();

            // January, February, December
            if (month === 0 || month === 1 || month === 11) {
                return true;
            }

            // Tuesday, except August
            if (day === 2 && month !== 7) {
                return true;
            }

            return false;
        }
    ]
});
</script>
{% endblock %}
