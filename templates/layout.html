<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <title>{% block title %}{% endblock %}</title>
    <style>
    /* Immediate critical overrides to ensure spacing and stacking (uses !important to beat cached CSS) */
    .app-main{ margin-top:130px !important; }
    .info-strip{ margin-top:0 !important; padding-top:1.25rem !important; }
    .glass-panel, .menu-category, .glass-card{ margin-bottom:1.25rem !important; padding:1.25rem !important; }
    .menu-grid{ gap:2rem !important; }
    .order-menu-grid{ gap:1.4rem !important; }
    .menu-card, .qr-card{ margin-bottom:1.25rem !important; }
    .menu-card-body{ padding:1.4rem !important; }
    .eyebrow{ z-index:9999 !important; position:relative !important; }
    .page-hero{ z-index:1 !important; position:relative !important; }
    </style>
</head>
<body class="app-body page-{{ (request.endpoint or 'home')|replace('_', '-') }}">

    <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-brand" href="/">Yialos <span>Grill</span></a>
        <div class="nav-actions">

            <a class="nav-btn primary" href="/login"> Login</a>
        </div>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="app-alerts" id="appAlerts">
            {% for category, message in messages %}
                <div class="alert app-alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <main class="app-main">
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
    <script>
        // Auto-hide flash alerts after 3 seconds
        (function(){
            const alerts = document.getElementById('appAlerts');
            if (!alerts) return;
            setTimeout(()=>{
                alerts.style.transition = 'opacity .45s ease, transform .45s ease';
                alerts.style.opacity = '0';
                alerts.style.transform = 'translate(-50%, -48%) scale(.98)';
                setTimeout(()=> alerts.remove(), 500);
            }, 3000);
        })();
    </script>
</body>
</html>
